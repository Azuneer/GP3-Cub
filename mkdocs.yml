site_name: Contexte Cub - GP3
site_description: Documentation BTS SIO — GP3 Contexte Cub
site_author: Ewen GADONNAUD et Rayan BOINA-BOINA

theme:
  name: material
  language: fr
  logo: assets/logo_cub.png
  favicon: assets/logo_cub.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/git-alt
    edit: material/pencil
    view: material/eye
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow

nav:
  - Accueil: index.md
  - Documentation:
      - documentation/index.md
      - Administration système:
          - "Virtualisation : Proxmox, VirtualBox et VirtIO": documentation/adminsys/virtualisation.md
          - "Windows Server : préparation, SConfig et Sysprep": documentation/adminsys/windows.md
          - "PowerShell : commandes, comptes et scripts": documentation/adminsys/powershell.md
          - "Windows Admin Center, WinRM et administration distante": documentation/adminsys/wac.md
          - "Debian : réseau, paquets et services systemd": documentation/adminsys/linux.md
          - "SSH, SCP et RDP": documentation/adminsys/ssh-rdp.md
          - "Active Directory, DNS et comptes": documentation/adminsys/active-directory.md
          - "RAID, sauvegardes et continuité": documentation/adminsys/raid-sauvegarde.md
      - Réseaux:
          - "IPv4, CIDR et calcul VLSM": documentation/reseau/adressage-vlsm.md
          - "VLAN, trunks et routage inter-VLAN": documentation/reseau/vlan-routage.md
          - "Cisco IOS : VLAN, SVI et routes": documentation/reseau/cisco.md
          - "NAT, PAT et publication de services": documentation/reseau/nat.md
          - "TCP, UDP, ICMP et diagnostic réseau": documentation/reseau/protocoles-diagnostic.md
          - "VPN : accès distant et interconnexion de sites": documentation/reseau/vpn.md
          - "Draw.io, plans de câblage et Packet Tracer": documentation/reseau/schemas-maquette.md
      - Cybersécurité:
          - "Stormshield : UTM, zones et politiques de sécurité": documentation/cybersecurite/stormshield.md
          - "Bastion Apache Guacamole : architecture et accès": documentation/cybersecurite/guacamole.md
          - "Authentification : mots de passe, Bitwarden et TOTP": documentation/cybersecurite/authentification.md
          - "AppArmor : confinement et diagnostic": documentation/cybersecurite/apparmor.md
          - "HTTPS, TLS et certificats": documentation/cybersecurite/tls.md
      - Services et supervision:
          - "DNS : résolution, autorité et enregistrements": documentation/services/dns.md
          - "Unbound : résolveur récursif, cache et DNSSEC": documentation/services/unbound.md
          - "NTP : synchronisation horaire et fuseaux": documentation/services/ntp.md
          - "Supervision, journaux et rsyslog": documentation/services/supervision.md
          - "Services Web : Apache, HTTP et publication en DMZ": documentation/services/services-web.md
          - "FTP, FTPS et SFTP": documentation/services/ftp.md
      - Git et documentation:
          - "Git et GitHub : versions, branches et collaboration": documentation/devops/versioning.md
          - "etckeeper : historique des configurations Linux": documentation/devops/etckeeper.md
          - "MkDocs Material, Obsidian et GitHub Pages": documentation/devops/mkdocs.md
  - Situations & Activités:
      - situations/index.md
      - Bloc 2 - Administration Système:
          - situations/bloc2-admin-sys/situation1-windows.md
          - situations/bloc2-admin-sys/situation2-wac.md
          - situations/bloc2-admin-sys/situation3-git.md
      - Bloc 2 - Exploitation des services:
          - situations/bloc2-services/activite0.md
          - situations/bloc2-services/activite1-dns-resolveur.md
      - Bloc 2 - Administration et supervision des réseaux:
          - situations/bloc2-reseaux/feuille-de-route.md
          - situations/bloc2-reseaux/activite0.md
      - Bloc 3 - Cybersécurité:
          - situations/bloc3-cyber/situation1.md
          - situations/bloc3-cyber/situation2.md
          - situations/bloc3-cyber/situation3.md
          - situations/bloc3-cyber/situation4.md
  - Ressources:
      - ressources/index.md
      - Toutes les productions: ressources/productions.md
      - Schémas: ressources/schemas.md
      - "Tables de routage - CUB GP3": ressources/tables-de-routage.md
      - "Table NAT - CUB GP3": ressources/table-nat.md
      - "TODO — Structuration du site Cub": ressources/organisation-site.md

plugins:
  - search:
      lang: fr
  - tags
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: Sur cette page

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/<ton-user>
  generator: false

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks/fiche_layout.py
