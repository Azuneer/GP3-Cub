site_name: Contexte Cub - GP3
site_description: Documentation BTS SIO — GP3 Contexte Cub
site_author: Ewen GADONNAUD et Rayan BOINA-BOINA

theme:
  name: material
  language: fr
  logo: assets/logo_cub.png
  favicon: assets/logo_cub.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/git-alt
    edit: material/pencil
    view: material/eye
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow

nav:
  - Accueil: index.md
  - Documentation:
      - documentation/index.md
      - Adminsys:
          - documentation/adminsys/linux.md
          - documentation/adminsys/windows.md
      - Cybersécurité:
          - documentation/cybersecurite/stormshield.md
      - DevOps:
          - documentation/devops/versioning.md
      - Réseau:
          - documentation/reseau/cisco.md
      - Services:
          - documentation/services/dns.md
          - documentation/services/services-web.md
          - documentation/services/supervision.md
  - Situations:
      - situations/index.md
      - Bloc 2 - Administration Système:
          - situations/bloc2-admin-sys/situation1-windows.md
      - Bloc 2 - Exploitation des services:
          - situations/bloc2-services/activite0.md
      - Bloc 2 - Administration et supervision des réseaux:
          - situations/bloc2-reseaux/feuille-de-route.md
      - Bloc 3 - Cybersécurité:
          - situations/bloc3-cyber/situation1.md
  - Situation professionnelles:
      - sp/index.md
  - Ressources:
      - ressources/index.md
      - Schémas: ressources/schemas.md

plugins:
  - search:
      lang: fr
  - tags
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: Sur cette page

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/<ton-user>
  generator: false

extra_css:
  - stylesheets/extra.css
